<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 16" width="1200" height="16">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4D7CFE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#272C36"/>
      <stop offset="50%" stop-color="#4D7CFE"/>
      <stop offset="65%" stop-color="#272C36"/>
      <stop offset="100%" stop-color="#4D7CFE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B95FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4D7CFE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Horizontal Glow Line -->
  <line x1="50" y1="8" x2="1150" y2="8" stroke="url(#dividerGrad)" stroke-width="1.5"/>

  <!-- Center Accent Glow & Node -->
  <circle cx="600" cy="8" r="8" fill="url(#nodeGlow)"/>
  <rect x="597" y="5" width="6" height="6" transform="rotate(45 600 8)" fill="#4D7CFE"/>
</svg>
