<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="50%" stop-color="#080A0F"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Electric Blue Gradient -->
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B95FF"/>
      <stop offset="100%" stop-color="#4D7CFE"/>
    </linearGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D7CFE" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#272C36"/>
      <stop offset="75%" stop-color="#272C36"/>
      <stop offset="100%" stop-color="#4D7CFE" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4D7CFE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4D7CFE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="leftGlow" cx="0%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4D7CFE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4D7CFE" stop-opacity="0"/>
    </radialGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D28"/>
      <stop offset="100%" stop-color="#10141D"/>
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="460" rx="16" fill="url(#bannerBg)"/>

  <!-- Architectural Grid Backdrop -->
  <g opacity="0.05">
    <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250 M 0 300 L 1200 300 M 0 350 L 1200 350 M 0 400 L 1200 400" stroke="#4D7CFE" stroke-width="1"/>
    <path d="M 50 0 L 50 460 M 100 0 L 100 460 M 150 0 L 150 460 M 200 0 L 200 460 M 250 0 L 250 460 M 300 0 L 300 460 M 350 0 L 350 460 M 400 0 L 400 460 M 450 0 L 450 460 M 500 0 L 500 460 M 550 0 L 550 460 M 600 0 L 600 460 M 650 0 L 650 460 M 700 0 L 700 460 M 750 0 L 750 460 M 800 0 L 800 460 M 850 0 L 850 460 M 900 0 L 900 460 M 950 0 L 950 460 M 1000 0 L 1000 460 M 1050 0 L 1050 460 M 1100 0 L 1100 460 M 1150 0 L 1150 460" stroke="#4D7CFE" stroke-width="1"/>
  </g>

  <!-- Ambient Light Effects -->
  <rect width="1200" height="460" rx="16" fill="url(#topGlow)"/>
  <rect width="1200" height="460" rx="16" fill="url(#leftGlow)"/>

  <!-- Outer Elegant Border -->
  <rect x="1" y="1" width="1198" height="458" rx="15" fill="none" stroke="url(#bannerBorder)" stroke-width="1.5"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(60, 48)">
    <!-- Availability Pill -->
    <rect width="320" height="32" rx="16" fill="#11141B" stroke="#272C36" stroke-width="1"/>
    <circle cx="18" cy="16" r="4.5" fill="#4D7CFE"/>
    <circle cx="18" cy="16" r="7" fill="none" stroke="#4D7CFE" stroke-width="1.5" opacity="0.5"/>
    <text x="34" y="20.5" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" font-weight="700" fill="#4D7CFE" letter-spacing="1.5">CREATIVE DEVELOPER · DIGITAL PRODUCT BUILDER</text>

    <!-- Version & Architecture Stamp -->
    <text x="1080" y="20.5" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600" fill="#9BA3B3" letter-spacing="1.5">PORTFOLIO ARCHITECTURE // V1.0</text>
  </g>

  <!-- Hero Core Center -->
  <g transform="translate(60, 115)">
    <!-- Monogram Icon Badge on Left -->
    <g transform="translate(0, 15)">
      <rect width="100" height="100" rx="24" fill="#11141B" stroke="#272C36" stroke-width="2"/>
      <rect width="100" height="100" rx="24" fill="none" stroke="#4D7CFE" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>
      <!-- S & P Letters -->
      <text x="50" y="66" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="46" font-weight="900" fill="#4D7CFE" letter-spacing="2">SP</text>
      <circle cx="78" cy="24" r="3.5" fill="#6B95FF"/>
    </g>

    <!-- Name & Statements on Right of Monogram -->
    <g transform="translate(130, 0)">
      <!-- Main Large Name -->
      <text x="0" y="70" font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" fill="#F5F4F0" letter-spacing="-1.5">SHAYAN POLANI</text>

      <!-- Dynamic Philosophy Statement -->
      <text x="0" y="112" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="17" font-weight="700" fill="url(#electricBlue)" letter-spacing="2">I THINK. I DESIGN. I BUILD. I OPTIMIZE. I DELIVER.</text>

      <!-- Concise Sub-narrative -->
      <text x="0" y="146" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="400" fill="#9BA3B3">Crafting high-performance digital platforms with modern engineering standards, AI systems &amp; editorial aesthetic precision.</text>
    </g>
  </g>

  <!-- Bottom Technology Stack Pills Bar -->
  <g transform="translate(60, 360)">
    <!-- Category Label -->
    <text x="0" y="24" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" fill="#9BA3B3" letter-spacing="2">CORE ARCHITECTURE // </text>

    <!-- Stack Badges -->
    <g transform="translate(160, 0)">
      <!-- Next.js 14 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="36" rx="8" fill="url(#badgeBg)" stroke="#272C36" stroke-width="1"/>
        <text x="65" y="22.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F5F4F0">Next.js 14</text>
      </g>

      <!-- React 18 -->
      <g transform="translate(142, 0)">
        <rect width="120" height="36" rx="8" fill="url(#badgeBg)" stroke="#272C36" stroke-width="1"/>
        <text x="60" y="22.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F5F4F0">React 18</text>
      </g>

      <!-- TypeScript -->
      <g transform="translate(274, 0)">
        <rect width="140" height="36" rx="8" fill="url(#badgeBg)" stroke="#272C36" stroke-width="1"/>
        <text x="70" y="22.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F5F4F0">TypeScript</text>
      </g>

      <!-- Tailwind CSS -->
      <g transform="translate(426, 0)">
        <rect width="150" height="36" rx="8" fill="url(#badgeBg)" stroke="#272C36" stroke-width="1"/>
        <text x="75" y="22.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F5F4F0">Tailwind CSS</text>
      </g>

      <!-- Framer Motion -->
      <g transform="translate(588, 0)">
        <rect width="160" height="36" rx="8" fill="url(#badgeBg)" stroke="#272C36" stroke-width="1"/>
        <text x="80" y="22.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F5F4F0">Framer Motion</text>
      </g>

      <!-- Meta API & Node -->
      <g transform="translate(760, 0)">
        <rect width="155" height="36" rx="8" fill="url(#badgeBg)" stroke="#4D7CFE" stroke-width="1" stroke-opacity="0.4"/>
        <text x="77.5" y="22.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#4D7CFE">Node / Express</text>
      </g>
    </g>
  </g>
</svg>
